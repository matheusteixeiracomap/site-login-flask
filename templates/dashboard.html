<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <div class="dashboard-container">


    <!-- SIDEBAR -->
    <aside class="sidebar">
        <h2>Sistema</h2>
        <nav>
            <a href="{{ url_for('dashboard') }}">🏠 Dashboard</a>

            {% if session.role == 'admin' %}
                <a href="{{ url_for('usuarios') }}">👤 Usuários</a>

            {% endif %}

            <a href="{{ url_for('logout') }}" class="logout">🚪 Sair</a>
        </nav>
    </aside>


    <!-- CONTEÚDO -->
    <main class="content">

        <!-- TOPBAR -->
        <header class="topbar">
            <h1>Dashboard</h1>
            <span>👋 Olá, {{ usuario }}</span>
        </header>

        <!-- CARDS -->
        <section class="cards">
            <div class="card">
                <h3>Usuários</h3>
                <p>{{ total }}</p>
            </div>

            <div class="card">
                <h3>Acessos Hoje</h3>
                <p>45</p>
            </div>

            <div class="card">
                <h3>Relatórios</h3>
                <p>12</p>
            </div>

            <div class="card">
                <h3>Status</h3>
                <p>Ativo</p>
            </div>
        </section>

        <!-- CONTEÚDO PRINCIPAL -->
        <section class="panel">
            <h2>Bem-vindo ao sistema</h2>
            <p>Aqui você pode gerenciar usuários, visualizar relatórios e acompanhar métricas.</p>
        </section>

    </main>
</div>

</body>
</html>
